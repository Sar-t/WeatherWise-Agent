[project]
name = "weatherwise"
version = "0.1.0"
description = "AI weather assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "certifi",  # CA bundle for the shared TLS context in services/http.py
    "timezonefinder>=6.5",
    "tzdata>=2024.1",  # IANA tz database for zoneinfo (needed on Windows)
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langgraph>=1.0",
    "pyyaml>=6.0",  # services/scoring/activities.yaml, guideline front matter, evals
    "sentence-transformers>=3.0",  # guidelines RAG embeddings (pulls in torch)
    "chromadb>=0.5",  # guidelines vector store
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",  # conversations (SQLite now, Postgres later)
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",  # conversation state survives restarts
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.services" = ["data/*.toml"]  # NAQI breakpoints
"backend.services.scoring" = ["*.yaml"]  # activity profiles

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["slow: needs a model download or other slow resources (opt in with RUN_SLOW=1)"]
