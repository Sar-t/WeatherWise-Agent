# --- air quality (now: aq = Thu 22 Oct 2026 12:00 IST, weather + air quality recorded together;
# air quality exists for Delhi and Paris only, so Jaipur's comes back unavailable) --------------
- id: aq_only_delhi_tomorrow
  now: aq
  turns:
    - message: Delhi mein kal pollution kaisa rahega?
      understanding: {intent: air_quality, locations: [Delhi], date_expr: tomorrow, include_air_quality: true}
      expect: {kind: answer, locations: [Delhi], mentions: [NAQI]}

