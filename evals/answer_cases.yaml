# --- official guidance (step 3f): real local retriever, index required --------------------------
# expect.guidance: true -> sources returned and the reply names a source; false -> neither.
# `synthetic:` marks values that are NOT recordings: air_scale multiplies recorded PM2.5/PM10
# (no recording has Poor air); alerts are added to the recorded forecast (none has an alert).
- id: gd_run_delhi_poor_air_asthma
  now: aq
  synthetic: {air_scale: 1.8}
  turns:
    - message: My father has asthma, can he go for his morning run in Delhi tomorrow?
      understanding: {intent: activity_recommendation, activity: running, recommendation_type: suitability, locations: [Delhi], date_expr: tomorrow, time_expr: morning, audience: sensitive_groups}
      expect: {kind: answer, locations: [Delhi], mentions: [NAQI], guidance: true}

- id: gd_mumbai_afternoon_walk_heat
